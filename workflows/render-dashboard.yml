name: Render Homicide Dashboard

on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies for sf/GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y libudunits2-dev libgdal-dev libgeos-dev libproj-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.1"

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::tidyr
            any::lubridate
            any::sf
            any::stringr
            any::jsonlite
            any::leaflet
            any::readxl
            any::htmlwidgets

      - name: Render dashboard
        env:
          HOMICIDE_DATA_URL: ${{ secrets.HOMICIDE_DATA_URL }}
        run: Rscript homicide_dashboard_map.R

      - name: Commit and push updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Update dashboard [automated]"
          git push
